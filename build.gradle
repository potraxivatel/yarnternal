plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

loom {
	mods {
		"yarnternal" {
			sourceSet sourceSets.main
		}
	}
}

// ---------------------------------------------------------------------------
// dev-запуск: ./loader -> ./gradlew runClient
// Ник и ОЗУ прилетают из лоадера: -PmcUsername=Foks -PmcRam=4G
// (если не передали — берутся значения по умолчанию)
// ---------------------------------------------------------------------------
def devUsername = providers.gradleProperty("mcUsername").getOrElse("Player")
def devRam = providers.gradleProperty("mcRam").getOrElse("4G")

// LWJGL 3.3.3 по умолчанию подсовывает свой libjemalloc.so (org.lwjgl.system.allocator
// = jemalloc). На musl (Alpine) он падает с SIGSEGV прямо при создании окна игры.
// Если система на musl — переключаем LWJGL на системный аллокатор.
def musl = new File('/lib/ld-musl-x86_64.so.1').exists()

// LWJGL 3.3.3 тащит OpenAL Soft 1.23.1, у которой семафоры (sem_init/sem_post)
// бросают std::system_error на musl. Исключение вылетает в потоке микшера, его
// никто не ловит → terminate и крах сразу после инициализации GL.
// Системный OpenAL (1.25.x) собран под musl и работает — берём его.
def systemOpenAl = ['/usr/lib/libopenal.so.1', '/usr/lib64/libopenal.so.1']
		.collect { new File(it) }
		.find { it.exists() }

loom {
	runs {
		client {
			programArgs "--username", devUsername
			vmArgs "-Xmx${devRam}"
			if (musl) {
				vmArgs "-Dorg.lwjgl.system.allocator=system"
			}
			if (musl && systemOpenAl != null) {
				vmArgs "-Dorg.lwjgl.openal.libname=${systemOpenAl}"
			}
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
  compileOnly "org.projectlombok:lombok:${project.lombok_version}"
  annotationProcessor "org.projectlombok:lombok:${project.lombok_version}"
  testCompileOnly "org.projectlombok:lombok:${project.lombok_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
